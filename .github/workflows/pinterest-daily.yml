name: Pinterest Auto-Pin (2x Daily)

# ─────────────────────────────────────────────────────────────────────────────
# Runs TWICE every day:
#   • 10:00 AM IST  →  04:30 UTC  (morning session)
#   • 07:00 PM IST  →  13:30 UTC  (evening session)
#
# Can also be triggered manually from GitHub → Actions → "Run workflow".
# Each session posts fresh articles that have never been pinned before.
# Duplicate-proofed via pinned_tracker.json committed back to the repo.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 4 * * *'    # 10:00 AM IST  (UTC+5:30)
    - cron: '30 13 * * *'   # 07:00 PM IST  (UTC+5:30)
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run (auto = detect from current time)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'morning'
          - 'evening'
      pins_per_session:
        description: 'Max pins to post this session (default: 8, one per niche)'
        required: false
        default: '8'
        type: string
      dry_run:
        description: 'Dry run — generate images but do NOT post to Pinterest'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  pin-articles:
    name: Post pins to Pinterest
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit pinned_tracker.json back to the repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Detect session (morning / evening) ─────────────────────────────
      - name: Detect session
        id: session
        run: |
          MANUAL="${{ github.event.inputs.session }}"
          if [ "$MANUAL" = "morning" ] || [ "$MANUAL" = "evening" ]; then
            echo "name=$MANUAL" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "name=morning" >> $GITHUB_OUTPUT
            else
              echo "name=evening" >> $GITHUB_OUTPUT
            fi
          fi

      # ── 3. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pillow

      # ── 5. Run the Pinterest bot ─────────────────────────────────────────────
      - name: Run Pinterest auto-pin bot (${{ steps.session.outputs.name }} session)
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_TECH:    ${{ secrets.PINTEREST_BOARD_TECH }}
          PINTEREST_BOARD_HEALTH:  ${{ secrets.PINTEREST_BOARD_HEALTH }}
          PINTEREST_BOARD_FINANCE: ${{ secrets.PINTEREST_BOARD_FINANCE }}
          PINTEREST_BOARD_TRAVEL:  ${{ secrets.PINTEREST_BOARD_TRAVEL }}
          PINTEREST_BOARD_RECIPES: ${{ secrets.PINTEREST_BOARD_RECIPES }}
          PINTEREST_BOARD_NEWS:    ${{ secrets.PINTEREST_BOARD_NEWS }}
          PINTEREST_BOARD_TRADING: ${{ secrets.PINTEREST_BOARD_TRADING }}
          PINTEREST_BOARD_AUTO:    ${{ secrets.PINTEREST_BOARD_AUTO }}
          SITE_URL:                ${{ secrets.SITE_URL }}
          SESSION:                 ${{ steps.session.outputs.name }}
          PINS_PER_SESSION:        ${{ github.event.inputs.pins_per_session || '8' }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run || 'false' }}
        run: python pinterest_bot/pinterest_auto_pin.py

      # ── 6. Commit updated tracker back to the repo ───────────────────────────
      # [skip ci] prevents this commit from triggering another workflow run.
      - name: Commit updated pin tracker
        run: |
          git config user.name  "Pinterest Bot"
          git config user.email "pinterest-bot@users.noreply.github.com"
          git add pinterest_bot/pinned_tracker.json
          git diff --staged --quiet \
            || git commit -m "chore: update pinterest tracker $(date -u +%Y-%m-%d) [${{ steps.session.outputs.name }}] [skip ci]"
          git push

      # ── 7. Summary ───────────────────────────────────────────────────────────
      - name: Post run summary
        if: always()
        run: |
          echo "## Pinterest Auto-Pin Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Date** | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Session** | ${{ steps.session.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pins requested** | ${{ github.event.inputs.pins_per_session || '8' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry run** | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          PINNED=$(python3 -c "import json; d=json.load(open('pinterest_bot/pinned_tracker.json')); print(len(d))")
          echo "| **Total articles pinned to date** | $PINNED |" >> $GITHUB_STEP_SUMMARY
