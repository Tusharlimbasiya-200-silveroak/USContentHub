services:
  - type: web
    name: uscontenthub
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn writeflow.wsgi:application --workers 2 --threads 2 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "uscontenthub.onrender.com"
      - key: DJANGO_CSRF_ORIGINS
        value: "https://uscontenthub.onrender.com"
      - key: SITE_URL
        value: "https://uscontenthub.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"
