<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USContentHub — Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #10b981;
      --yellow: #f59e0b;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 2rem 1rem; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 3rem; }
    .header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--muted); margin-top: .5rem; font-size: .95rem; }
    .stats-strip { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 2rem; text-align: center; min-width: 140px; }
    .stat-card .value { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-card .label { font-size: .8rem; color: var(--muted); margin-top: .25rem; text-transform: uppercase; letter-spacing: .05em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; max-width: 1200px; margin: 0 auto; }
    .pub-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; transition: border-color .2s; }
    .pub-card:hover { border-color: var(--primary); }
    .pub-card .pub-header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; }
    .pub-card .icon { font-size: 1.8rem; }
    .pub-card .name { font-size: 1rem; font-weight: 700; }
    .pub-card .slug { font-size: .75rem; color: var(--muted); }
    .pub-card .count { font-size: 2.5rem; font-weight: 800; color: var(--green); }
    .pub-card .count-label { font-size: .8rem; color: var(--muted); margin-top: .1rem; }
    .pub-card .bar-wrap { background: var(--border); border-radius: 4px; height: 6px; margin-top: 1rem; overflow: hidden; }
    .pub-card .bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--green)); transition: width .6s ease; }
    .footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 3rem; }
    .updated { text-align: center; color: var(--muted); font-size: .8rem; margin-bottom: 2rem; }
  </style>
</head>
<body>

<div class="header">
  <h1>USContentHub Dashboard</h1>
  <p>Content performance overview across all 7 publications</p>
</div>

<p class="updated" id="updatedTime">Last updated: —</p>

<div class="stats-strip">
  <div class="stat-card">
    <div class="value" id="totalArticles">328</div>
    <div class="label">Total Articles</div>
  </div>
  <div class="stat-card">
    <div class="value">7</div>
    <div class="label">Publications</div>
  </div>
  <div class="stat-card">
    <div class="value">Daily</div>
    <div class="label">Pinterest Bot</div>
  </div>
  <div class="stat-card">
    <div class="value">Live</div>
    <div class="label">Status</div>
  </div>
</div>

<div class="grid" id="pubGrid"></div>

<div class="footer">
  <p>USContentHub &copy; 2026 &mdash; Built with Django &amp; GitHub Actions</p>
</div>

<script>
const publications = [
  { name: "USA Travel Explorer",      slug: "usa-travel-explorer",    icon: "✈️",  articles: 67 },
  { name: "Recipe Kitchen USA",       slug: "recipe-kitchen-usa",     icon: "🍳",  articles: 65 },
  { name: "USA News Digest",          slug: "usa-news-digest",        icon: "📰",  articles: 61 },
  { name: "Health & Wellness Daily",  slug: "health-wellness-daily",  icon: "💪",  articles: 52 },
  { name: "Tech Gadget Hub",          slug: "tech-gadget-hub",        icon: "💻",  articles: 34 },
  { name: "Smart Money Guide",        slug: "smart-money-guide",      icon: "💰",  articles: 31 },
  { name: "The Trading Blueprint",    slug: "the-trading-blueprint",  icon: "📈",  articles: 18 },
];

const maxArticles = Math.max(...publications.map(p => p.articles));
const total = publications.reduce((s, p) => s + p.articles, 0);
document.getElementById("totalArticles").textContent = total;

const grid = document.getElementById("pubGrid");
publications.forEach(pub => {
  const pct = Math.round((pub.articles / maxArticles) * 100);
  grid.innerHTML += `
    <div class="pub-card">
      <div class="pub-header">
        <span class="icon">${pub.icon}</span>
        <div>
          <div class="name">${pub.name}</div>
          <div class="slug">${pub.slug}</div>
        </div>
      </div>
      <div class="count">${pub.articles}</div>
      <div class="count-label">published articles</div>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
    </div>`;
});

document.getElementById("updatedTime").textContent =
  "Last updated: " + new Date().toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
</script>
</body>
</html>
