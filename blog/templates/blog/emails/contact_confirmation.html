<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We received your message</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:'Segoe UI',Roboto,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 16px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

      <tr>
        <td style="background:linear-gradient(135deg,#2f8d46,#1f6e35);padding:36px 32px;text-align:center;">
          <div style="font-size:2.2rem;margin-bottom:8px;">📚</div>
          <h1 style="margin:0;color:#ffffff;font-size:1.4rem;font-weight:700;">USA Content Hub</h1>
        </td>
      </tr>

      <tr>
        <td style="padding:36px 40px 28px;">
          <h2 style="margin:0 0 16px;color:#1e293b;font-size:1.25rem;">Message received ✅</h2>
          <p style="margin:0 0 18px;color:#475569;font-size:.95rem;line-height:1.7;">
            Hi <strong>{{ name }}</strong>,<br><br>
            Thanks for reaching out! We've received your message and will
            get back to you at <strong>{{ email }}</strong> within 1–2 business days.
          </p>

          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;border-radius:10px;margin:0 0 24px;">
            <tr><td style="padding:20px 24px;">
              <p style="margin:0 0 10px;font-weight:700;color:#1e293b;font-size:.88rem;text-transform:uppercase;letter-spacing:.06em;">Your message</p>
              <p style="margin:0 0 6px;font-size:.85rem;color:#64748b;"><strong>Subject:</strong> {{ subject }}</p>
              <p style="margin:0;font-size:.85rem;color:#64748b;line-height:1.6;">{{ message }}</p>
            </td></tr>
          </table>

          <table width="100%" cellpadding="0" cellspacing="0">
            <tr><td align="center">
              <a href="https://us-content-hub.vercel.app/"
                 style="display:inline-block;padding:12px 32px;background:#2f8d46;color:#fff;text-decoration:none;border-radius:50px;font-weight:700;font-size:.9rem;">
                Visit USA Content Hub
              </a>
            </td></tr>
          </table>
        </td>
      </tr>

      <tr>
        <td style="padding:20px 40px 28px;border-top:1px solid #e2e8f0;text-align:center;">
          <p style="margin:0;color:#94a3b8;font-size:.75rem;">© 2026 USA Content Hub · All rights reserved</p>
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
